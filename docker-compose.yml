version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./ghost_protocol.db
      - SECRET_KEY=ghost-protocol-production-secret-key-change-this
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/ghost_protocol.db:/app/ghost_protocol.db
    restart: unless-stopped
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  uploads: