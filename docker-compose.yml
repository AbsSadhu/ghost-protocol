version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=ghost-protocol-secret-key-change-in-production
      - DATABASE_URL=postgresql://postgres:password@db:5432/ghost_protocol
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    networks:
      - ghost-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ghost-network

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=ghost_protocol
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ghost-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ghost-network

volumes:
  postgres_data:

networks:
  ghost-network:
    driver: bridge